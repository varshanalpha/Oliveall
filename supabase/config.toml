# Disable gateway legacy JWT pre-check so Supabase Auth ES256 user tokens pass through
# to inside-function strict verification (`userClient.auth.getUser()`), and Razorpay webhooks
# authenticate via cryptographic `x-razorpay-signature` HMAC-SHA256 verification.

[functions.create-razorpay-order]
verify_jwt = false

[functions.verify-razorpay-payment]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

